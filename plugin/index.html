<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e21; color: #e4e4e8; font-family: -apple-system, sans-serif;
    font-size: 11px; padding: 12px; }
  h3 { font-size: 13px; color: #fff; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 10px; margin-bottom: 10px; }

  section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
  section h4 { font-size: 11px; color: #fff; margin-bottom: 6px; }

  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .row label { width: 88px; flex-shrink: 0; color: #999; }
  .row .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; font-size: 10px; }
  .row input[type=text], .row input[type=number], .row select {
    background: #2a2a2d; color: #e4e4e8; border: 1px solid #555; border-radius: 3px;
    padding: 3px 6px; font-size: 10px; flex: 1; }

  button { background: #333; color: #e4e4e8; border: 1px solid #555; border-radius: 3px;
    padding: 3px 8px; font-size: 10px; cursor: pointer; }
  button:hover { background: #444; }
  button.primary { background: #2d6cdf; border-color: #2d6cdf; }
  button.primary:hover { background: #3a7bf0; }
  button.danger { background: #7a2d2d; border-color: #7a2d2d; }
  button.danger:hover { background: #963636; }
  button:disabled { opacity: 0.5; cursor: default; }

  .actions { display: flex; gap: 6px; margin-top: 6px; }

  .detected { background: #232326; border-radius: 3px; padding: 6px 8px; margin-bottom: 6px; font-size: 10px; color: #aaa; }
  .detected-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .detected-row:last-child { margin-bottom: 0; }
  .detected-icon { width: 14px; flex-shrink: 0; text-align: center; }
  .ok { color: #6cd67a; }
  .warn { color: #e0b846; }
  .err { color: #e06060; }

  #log { margin-top: 8px; max-height: 160px; overflow-y: auto; background: #141416;
    border-radius: 3px; padding: 6px; font-size: 10px; line-height: 1.5; white-space: pre-wrap; }
</style>
</head>
<body>
  <h3>Mic Check <span id="pluginStatus">⚫</span></h3>
  <div class="subtitle">Chạy độc lập trong Premiere — không cần server/Claude/mạng.</div>

  <section id="micCheckSection">
    <h4>Mic Check</h4>
    <div class="body">
      <div class="row">
        <label>Thư mục dự án</label>
        <span class="val" id="mcFolderPath">(chưa chọn)</span>
        <button id="mcPickFolder">Chọn</button>
      </div>
      <div id="mcDetected" class="detected"></div>
      <div class="row">
        <label>Tên sequence</label>
        <input type="text" id="mcSequenceName" placeholder="vd: FFWS Week2">
      </div>
      <div class="row">
        <label>Hướng khung hình</label>
        <select id="mcOrientation">
          <option value="landscape">Landscape 1920x1080</option>
          <option value="portrait">Portrait 1080x1920</option>
        </select>
      </div>
      <div class="actions">
        <button id="mcRunBtn" class="primary" disabled>▶ Chạy Mic Check</button>
        <button id="mcVerifyBtn" disabled>✓ Verify</button>
      </div>
    </div>
  </section>

  <div id="log"></div>

<script src="actions.js"></script>
<script src="panel.js"></script>
</body>
</html>
