<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e21; color: #e4e4e8; font-family: -apple-system, sans-serif;
    font-size: 10px; padding: 8px; }

  .head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .head b { font-size: 11px; color: #fff; }
  .head .dot { font-size: 9px; }
  .head .subtitle { color: #666; font-size: 9px; margin-left: auto; }

  .row { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
  .row label { width: 44px; flex-shrink: 0; color: #999; font-size: 10px; white-space: nowrap; cursor: default; }
  .row .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; font-size: 10px; }

  .row input[type=text], .row input[type=number], .row select {
    background: #2a2a2d; color: #e4e4e8; border: 1px solid #555; border-radius: 3px;
    padding: 2px 6px; font-size: 10px; height: 22px; flex: 1; }
  .row input[type=number].small { flex: 0 0 42px; max-width: 42px; padding: 2px 4px; }

  .section-sep { margin-top: 6px; border-top: 1px solid #333; padding-top: 6px; }

  .row select {
    appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%);
    background-position: right 9px center, right 5px center;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
    padding-right: 20px;
  }

  /* Dùng <div role="button"> thay vì <button> thật — UXP từng xác nhận native chrome của OS đè mất
     style tuỳ chỉnh trên <button> thật (đã gặp ở dự án Beat Shake cùng công ty). Cũng tránh dùng
     display:grid (chưa kiểm chứng trong webview UXP), thay bằng flex lồng flex — pattern đã dùng ổn
     định khắp file này. */
  .zone-grid { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .zone-row { display: flex; gap: 2px; }
  .zone-btn { width: 16px; height: 16px; background: #2a2a2d; border: 1px solid #555;
    border-radius: 2px; cursor: pointer; }
  .zone-btn:hover { background: #444; }
  .zone-btn.active { background: #2d6cdf; border-color: #2d6cdf; }

  .info-icon { flex-shrink: 0; width: 14px; height: 14px; border-radius: 50%; background: #333;
    border: 1px solid #666; color: #aaa; font-size: 9px; line-height: 12px; text-align: center;
    cursor: help; }
  .info-icon:hover { background: #444; color: #ddd; }

  button { background: #333; color: #e4e4e8; border: 1px solid #555; border-radius: 3px;
    padding: 2px 8px; font-size: 10px; height: 22px; cursor: pointer; flex-shrink: 0; }
  button:hover { background: #444; }
  button.primary { background: #2d6cdf; border-color: #2d6cdf; }
  button.primary:hover { background: #3a7bf0; }
  button:disabled { opacity: 0.5; cursor: default; }

  .actions { display: flex; gap: 5px; margin-top: 4px; margin-bottom: 4px; }
  .actions button { flex: 1; height: 24px; }

  .detected { background: #232326; border-radius: 3px; padding: 5px 7px; margin-bottom: 4px;
    font-size: 9px; color: #aaa; max-height: 110px; overflow-y: auto; }
  .detected:empty { display: none; padding: 0; margin: 0; }
  .detected-row { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
  .detected-row:last-child { margin-bottom: 0; }
  .detected-icon { width: 12px; flex-shrink: 0; text-align: center; }
  .ok { color: #6cd67a; }
  .warn { color: #e0b846; }
  .err { color: #e06060; }

  #log { margin-top: 4px; max-height: 130px; overflow-y: auto; background: #141416;
    border-radius: 3px; padding: 5px; font-size: 9px; line-height: 1.45; white-space: pre-wrap; }

  .progress-wrap { margin-top: 6px; }
  .progress-wrap[hidden] { display: none; }
  .progress-bar { height: 6px; background: #2a2a2d; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #2d6cdf; transition: width 0.15s ease; }
  .progress-text { font-size: 9px; color: #999; margin-top: 2px; }
</style>
</head>
<body>
  <div class="head">
    <b>Mic Check</b> <span id="mcVersion" style="color:#666; font-size:9px;"></span><span class="dot" id="pluginStatus">⚫</span>
    <span class="subtitle">độc lập — không cần Claude/mạng</span>
  </div>

  <div class="row">
    <label title="Thư mục ảnh nhân vật dùng chung">Ảnh</label>
    <span class="val" id="mcImagesPath">(chưa chọn)</span>
    <button id="mcPickImages">Chọn</button>
  </div>
  <div class="row">
    <label title="Thư mục dữ liệu (cues.json/.srt/video)">Dữ liệu</label>
    <span class="val" id="mcFolderPath">(chưa chọn)</span>
    <button id="mcPickFolder">Chọn</button>
  </div>
  <div id="mcDetected" class="detected"></div>
  <div class="row">
    <label title="Nhiều mã cách nhau bằng dấu ;">Mã</label>
    <input type="text" id="mcCodes" placeholder="VN-FL-D3-G2; VN-FL-D3-G1">
  </div>
  <div class="row">
    <label>Hướng</label>
    <select id="mcOrientation">
      <option value="landscape">Landscape 1920x1080</option>
      <option value="portrait">Portrait 1080x1920</option>
    </select>
  </div>
  <div class="actions">
    <button id="mcRunBtn" class="primary" disabled>▶ Chạy Mic Check</button>
    <button id="mcVerifyBtn" disabled>✓ Verify</button>
  </div>

  <div class="row section-sep">
    <label title="Số track V hiển thị trên timeline Premiere — vd ảnh nằm ở V2 thì gõ 2">Track</label>
    <input type="number" id="mcLayoutTrack" class="small" value="2" min="1" step="1">
    <span style="font-size:9px; color:#666;">(vd V2 → gõ 2, khớp đúng số Premiere hiển thị)</span>
  </div>
  <div class="row">
    <label title="Vị trí Position X/Y — pixel tuyệt đối, GIỐNG HỆT số hiển thị trong Effect Controls > Motion > Position của Premiere">Vị trí</label>
    <div class="zone-grid" id="mcZoneGrid">
      <div class="zone-row">
        <div class="zone-btn" role="button" data-x="0.15" data-y="0.15"></div>
        <div class="zone-btn" role="button" data-x="0.5" data-y="0.15"></div>
        <div class="zone-btn" role="button" data-x="0.85" data-y="0.15"></div>
      </div>
      <div class="zone-row">
        <div class="zone-btn" role="button" data-x="0.15" data-y="0.5"></div>
        <div class="zone-btn active" role="button" data-x="0.5" data-y="0.5"></div>
        <div class="zone-btn" role="button" data-x="0.85" data-y="0.5"></div>
      </div>
      <div class="zone-row">
        <div class="zone-btn" role="button" data-x="0.15" data-y="0.85"></div>
        <div class="zone-btn" role="button" data-x="0.5" data-y="0.85"></div>
        <div class="zone-btn" role="button" data-x="0.85" data-y="0.85"></div>
      </div>
    </div>
    <input type="number" id="mcLayoutX" class="small" value="960" step="1">
    <input type="number" id="mcLayoutY" class="small" value="540" step="1">
  </div>
  <div class="row">
    <label title="Scale % — GIỐNG HỆT số hiển thị trong Effect Controls > Motion > Scale">Scale %</label>
    <input type="number" id="mcLayoutScale" class="small" value="100" step="1">
  </div>
  <div class="actions">
    <button id="mcLayoutPickBtn" title="Đọc lại Position/Scale THẬT của clip đang chọn trên timeline (vd sau khi bạn tự kéo tay chỉnh trong Program Monitor) và điền vào ô trên.">Lấy motion từ ảnh đang chọn</button>
  </div>
  <div class="actions">
    <button id="mcLayoutBtn">Áp dụng thay đổi cho ảnh trên track</button>
    <span class="info-icon" title="Sẽ GHI ĐÈ Position/Scale của TOÀN BỘ ảnh trên track đã chọn bằng đúng số ở trên — kể cả những ảnh bạn đã tự kéo tay chỉnh riêng trước đó. Muốn lấy chuẩn từ 1 ảnh đã chỉnh tay, chọn ảnh đó rồi bấm &quot;Lấy từ ảnh đang chọn&quot; trước.">i</span>
  </div>

  <div class="progress-wrap" id="mcProgressWrap" hidden>
    <div class="progress-bar"><div class="progress-fill" id="mcProgressFill"></div></div>
    <div class="progress-text" id="mcProgressText"></div>
  </div>

  <div id="log"></div>

<script src="actions.js"></script>
<script src="panel.js"></script>
</body>
</html>
